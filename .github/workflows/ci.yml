name: ci

# Every PR, including stacked ones whose base is another PR's branch, and
# every push to main. The full suite takes twenty minutes and more and runs
# on a quiet machine before merging (CLAUDE.md); this is the short tier,
# the build of both modules and the digest.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and vet
        run: |
          go build ./...
          go vet ./...
      - name: Build and vet cmd/zarr
        working-directory: cmd/zarr
        run: |
          go build ./...
          go vet ./...
      - name: Short tier
        run: go test -short -timeout 60m ./...
      - name: Digest
        run: TERRA_DIGEST=check go test -run TestWorldDigest -count=1 -timeout 60m .
